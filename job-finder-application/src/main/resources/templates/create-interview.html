<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Schedule Interview')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">

    <div class="form-container">

        <h2 class="form-title">
            Schedule Interview
        </h2>

        <div th:replace="~{fragments/messages :: messages}"></div>

        <form th:action="@{/interviews/create/{applicationId}(applicationId=${applicationId})}"
              th:object="${interviewRequest}"
              method="post">

            <div class="form-group">

                <label>
                    Scheduled Date & Time
                </label>

                <input type="datetime-local"
                       class="form-control"
                       th:field="*{scheduledAt}">

                <span class="validation-error"
                      th:errors="*{scheduledAt}">
                </span>

            </div>


            <div class="form-group">

                <label>
                    Interview Type
                </label>

                <select class="form-control"
                        th:field="*{type}">

                    <option value="">
                        Select interview type
                    </option>

                    <option value="ONLINE">
                        Online
                    </option>

                    <option value="ONSITE">
                        Onsite
                    </option>

                    <option value="PHONE">
                        Phone
                    </option>

                </select>

                <span class="validation-error"
                      th:errors="*{type}">
                </span>

            </div>


            <div class="form-group">

                <label>
                    Location
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{location}"
                       placeholder="Office location if applicable">

                <span class="validation-error"
                      th:errors="*{location}">
                </span>

            </div>


            <div class="form-group">

                <label>
                    Meeting Link
                </label>

                <input type="url"
                       class="form-control"
                       th:field="*{meetingLink}"
                       placeholder="https://...">

                <span class="validation-error"
                      th:errors="*{meetingLink}">
                </span>

            </div>


            <div class="d-flex gap-2 mt-3">

                <button type="submit"
                        class="btn btn-success">
                    Schedule Interview
                </button>

                <a class="btn btn-secondary"
                   th:href="@{/interviews}">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
